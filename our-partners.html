<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Partners — Etijon Foundation Inc.</title>
  <meta name="description" content="Meet the key organization, government, and healthcare partners collaborating with Etijon Foundation to impact communities.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/about.css">
  <link rel="stylesheet" href="assets/css/partners.css">
</head>
<body>

  <!-- Dynamic Site Header -->
  <header class="site-header" id="header-placeholder"></header>

  <!-- Page Content Container -->
  <main class="partners-page-container">
    
    <!-- Back Home Link -->
    <div class="back-link-wrapper">
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back Home
      </a>
    </div>

    <!-- Page Header -->
    <div class="programs-page-header">
      <span class="section-header-badge">COLLABORATING FOR IMPACT</span>
      <h1 class="section-main-heading">Our Partners</h1>
    </div>

    <!-- Partners Grid (3 Large Cards) -->
    <section class="partners-grid">
      
      <!-- Partner Card 1: Akwa Ibom State Ministry of Health -->
      <div class="partner-card">
        <div class="partner-logo-wrapper">
          <img src="assets/images/partner_logo_akwa_ibom.png" alt="Akwa Ibom State Ministry of Health" class="partner-logo-img">
        </div>
        <div class="partner-label">Akwa Ibom State Ministry of Health</div>
      </div>

      <!-- Partner Card 2: Initiative for People's Good Health (IPGH) -->
      <div class="partner-card">
        <div class="partner-logo-wrapper">
          <img src="assets/images/partner_logo_ipgh.png" alt="Initiative for People's Good Health (IPGH)" class="partner-logo-img">
        </div>
        <div class="partner-label">Initiative for People's Good Health (IPGH)</div>
      </div>

      <!-- Partner Card 3: ANTOF -->
      <div class="partner-card">
        <div class="partner-logo-wrapper">
          <img src="assets/images/partner_logo_antof.png" alt="ANTOF" class="partner-logo-img">
        </div>
        <div class="partner-label">ANTOF</div>
      </div>

    </section>

    <!-- Partner with us CTA Banner Box -->
    <section class="partner-cta-box">
      <div class="partner-cta-left">
        <div class="partner-cta-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#EBAC00"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        </div>
        <div>
          <h2 class="partner-cta-title">Partner with us</h2>
          <p class="partner-cta-desc">Organizations and sponsors can partner with Etijon Foundation to expand the impact of our programs.</p>
        </div>
      </div>
      <a href="contact-us.html" class="btn-become-partner">Become a Partner</a>
    </section>

  </main>

  <!-- Dynamic Site Footer -->
  <footer class="site-footer" id="footer-placeholder"></footer>

  <!-- Component Inserter Script -->
  <script src="assets/js/header-footer.js"></script>

</body>
</html>
