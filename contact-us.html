<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — Etijon Foundation Inc.</title>
  <meta name="description" content="Get in touch with Etijon Foundation Inc. Send us a message or reach out via email for inquiries, partnerships, and support.">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/about.css">
  <link rel="stylesheet" href="assets/css/contact.css">
</head>
<body>

  <!-- Dynamic Site Header -->
  <header class="site-header" id="header-placeholder"></header>

  <!-- Page Content Container -->
  <main class="contact-page-container">
    
    <!-- Background Soft Decorative Circles & Floating Dots matching Figma -->
    <div class="contact-bg-circle-tr"></div>
    <div class="contact-bg-dot-tr"></div>
    <div class="contact-bg-circle-bl"></div>
    <div class="contact-bg-dot-bl"></div>

    <div class="contact-content-wrapper">
      
      <!-- Back Home Link -->
      <div class="back-link-wrapper">
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Back Home
        </a>
      </div>

      <!-- Page Header -->
      <div class="programs-page-header">
        <span class="section-header-badge">WE WOULD LOVE TO HEAR FROM YOU</span>
        <h1 class="section-main-heading">Contact Us</h1>
      </div>

      <!-- Two-Column Contact Grid -->
      <section class="contact-grid">
        
        <!-- Left Column: Contact Information Card -->
        <div class="contact-info-card">
          <div>
            <h2 class="contact-info-card-title">CONTACT INFORMATION</h2>

            <!-- Item 1: Send a Mail (Clickable Mailto Link) -->
            <div class="contact-info-item">
              <div class="contact-info-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              </div>
              <div>
                <div class="contact-info-sublabel">SEND A MAIL</div>
                <div class="contact-info-value">
                  <a href="mailto:info@etijon.org" style="color: inherit; text-decoration: underline;">INFO@ETIJON.ORG</a>
                </div>
              </div>
            </div>

            <!-- Item 2: Visit Our Website (Clickable Web Link) -->
            <div class="contact-info-item">
              <div class="contact-info-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
              </div>
              <div>
                <div class="contact-info-sublabel">VISIT OUR WEBSITE</div>
                <div class="contact-info-value">
                  <a href="https://www.etijon.org" target="_blank" style="color: inherit; text-decoration: underline;">WWW.ETIJON.ORG</a>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div class="contact-info-divider"></div>
            <div class="contact-info-footer-note">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>We typically respond within 24-48 hours</span>
            </div>
          </div>
        </div>

        <!-- Right Column: Contact Form Card -->
        <div class="contact-form-card">
          <h2 class="contact-form-title">CONTACT FORM</h2>
          
          <!-- Success Notification Banner -->
          <div id="contact-success-banner" style="display: none; background-color: #E6F4EA; border: 1px solid #34A853; color: #137333; padding: 16px; border-radius: 12px; margin-bottom: 20px; font-size: 0.95rem; font-weight: 600;">
            ✓ Thank you! Your message has been prepared for info@etijon.org. We will respond within 24-48 hours.
          </div>

          <!-- Form without HTTP POST server submit to prevent Error 501 crash -->
          <form id="contact-form" onsubmit="handleContactSubmit(event)">
            
            <div class="form-group">
              <label for="contact-name" class="form-label">Name</label>
              <input type="text" id="contact-name" name="name" class="form-input" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
              <label for="contact-email" class="form-label">Email</label>
              <input type="email" id="contact-email" name="email" class="form-input" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
              <label for="contact-subject" class="form-label">Subject</label>
              <input type="text" id="contact-subject" name="subject" class="form-input" placeholder="Enter Subject" required>
            </div>

            <div class="form-group">
              <label for="contact-message" class="form-label">Message</label>
              <textarea id="contact-message" name="message" class="form-textarea" placeholder="Write your message here" required></textarea>
            </div>

            <button type="submit" class="btn-form-submit">Submit</button>

          </form>
        </div>

      </section>

    </div>
  </main>

  <!-- Dynamic Site Footer -->
  <footer class="site-footer" id="footer-placeholder"></footer>

  <!-- Component Inserter Script -->
  <script src="assets/js/header-footer.js"></script>

  <script>
    function handleContactSubmit(e) {
      if (e) e.preventDefault();

      const name = document.getElementById('contact-name').value;
      const email = document.getElementById('contact-email').value;
      const subject = document.getElementById('contact-subject').value;
      const message = document.getElementById('contact-message').value;

      // Construct mailto link to send email directly to info@etijon.org
      const mailtoUrl = `mailto:info@etijon.org?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent("Sender Name: " + name + "\nSender Email: " + email + "\n\nMessage:\n" + message)}`;

      // Open user's email client
      window.location.href = mailtoUrl;

      // Show success notification banner
      const successBanner = document.getElementById('contact-success-banner');
      if (successBanner) {
        successBanner.style.display = 'block';
      }

      // Reset form
      document.getElementById('contact-form').reset();
      return false;
    }
  </script>

</body>
</html>
